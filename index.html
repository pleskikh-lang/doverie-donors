<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7f2"><title>Донорство крови — ветеринарная клиника «Доверие»</title><style>
:root{--navy:#102747;--red:#9b1821;--cream:#faf7f2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:1080px;margin:0 auto;padding:50px 24px 42px;text-align:center}.eyebrow{font-size:13px;letter-spacing:.27em;font-weight:600;margin-bottom:30px}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(58px,9vw,110px);line-height:.94;letter-spacing:-.045em;margin:0}h1 span{display:block;color:var(--red)}.intro{font-size:clamp(16px,2vw,21px);line-height:1.5;margin:27px auto 33px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1000px;margin:auto}.card{border:1px solid #d8d0c8;border-radius:22px;text-decoration:none;color:inherit;background:#fffdfb;overflow:hidden;padding:18px 20px 28px;display:flex;flex-direction:column;align-items:center;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px #10274714}.photo{width:100%;height:270px;object-fit:contain;mix-blend-mode:multiply}.name{font:normal clamp(35px,4vw,47px) Georgia,serif;margin:5px 0 14px}.action{color:var(--red);font-size:17px}footer{margin-top:35px;color:#657083;font-size:14px;line-height:1.55}footer:before{content:'';display:block;width:140px;height:1px;background:#ded7cf;margin:0 auto 20px}@media(max-width:620px){main{padding:38px 15px}.eyebrow{font-size:10px;letter-spacing:.18em;margin-bottom:28px}.intro{margin:25px auto 26px}.cards{gap:12px}.card{border-radius:16px;padding:8px 7px 20px}.photo{height:170px}.name{font-size:29px;margin:8px 0 12px}.action{font-size:12px}footer{font-size:12px}}@media(max-width:380px){.photo{height:140px}.name{font-size:26px}}
</style></head><body><main><div class="eyebrow">ВЕТЕРИНАРНАЯ КЛИНИКА «ДОВЕРИЕ»</div><h1>ДОНОРСТВО<span>КРОВИ</span></h1><p class="intro">Помогите спасти жизнь другому животному.<br>Выберите, кто хочет стать донором.</p><section class="cards"><a class="card" href="dogs.pdf" aria-label="Открыть условия донорства для собак"><img class="photo" src="dog.jpg" alt="Тайский риджбек"><div class="name">Собаки</div><div class="action">Условия донорства →</div></a><a class="card" href="cats.pdf" aria-label="Открыть условия донорства для кошек"><img class="photo" src="cat.jpg" alt="Серая кошка"><div class="name">Кошки</div><div class="action">Условия донорства →</div></a></section><footer>Узнайте условия участия и бонусы для доноров.<br>Ветеринарная клиника «Доверие»</footer></main></body></html>
