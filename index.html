<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f5ef">
<title>Донорство крови — ветеринарная клиника «Доверие»</title>
<style>
:root{--cream:#f8f5ef;--navy:#122746;--red:#a51d29;--line:#d8d5d0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Arial,Helvetica,sans-serif}main{max-width:760px;margin:auto;padding:58px 22px 68px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(42px,9vw,76px);font-weight:400;line-height:1.04;letter-spacing:-.035em;margin:32px 0 18px}h1 span{color:var(--red)}.subtitle{font-size:17px;line-height:1.5;margin:0 auto 40px;max-width:400px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;border:1px solid var(--line);border-radius:18px;background:#fffdfa;color:var(--navy);text-decoration:none;padding:24px 12px;transition:transform .2s,box-shadow .2s}.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 12px 25px #12274616}.symbol{font-size:76px;line-height:1.4}.card strong{font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:400}.card small{margin-top:12px;color:var(--red);font-size:14px}footer{margin-top:50px;font-size:13px;line-height:1.6;color:#6a7180}.rule{height:1px;background:var(--line);max-width:140px;margin:0 auto 20px}@media(max-width:450px){main{padding-top:45px}.cards{gap:10px}.card{min-height:235px;padding:20px 6px}.symbol{font-size:60px}.card strong{font-size:24px}.subtitle{font-size:16px}}
</style>
</head>
<body><main>
<div class="eyebrow">Ветеринарная клиника «Доверие»</div>
<h1>ДОНОРСТВО<br><span>КРОВИ</span></h1>
<p class="subtitle">Помогите спасти жизнь другому животному.<br>Выберите, кто хочет стать донором.</p>
<div class="cards">
<a class="card" href="dogs.pdf" aria-label="Открыть брошюру о донорстве крови у собак"><span class="symbol" aria-hidden="true">🐕</span><strong>Собаки</strong><small>Условия донорства →</small></a>
<a class="card" href="cats.pdf" aria-label="Открыть брошюру о донорстве крови у кошек"><span class="symbol" aria-hidden="true">🐈</span><strong>Кошки</strong><small>Условия донорства →</small></a>
</div>
<footer><div class="rule"></div>Узнайте условия участия и бонусы для доноров.<br>Ветеринарная клиника «Доверие»</footer>
</main></body></html>
